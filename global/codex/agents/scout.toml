name = "scout"
description = "読み取り専用の探索係。ファイル・シンボル・設定の所在調査、ログやテスト出力の要約、ドキュメント参照など、判断を伴わない広い読み込みに使う。編集はしない。"
model = "gpt-6-luna"
model_reasoning_effort = "low"
sandbox_mode = "read-only"
