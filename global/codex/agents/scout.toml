- 検索はパス・件数・行範囲を絞る。ファイル全文を読むのは必要な場合だけ。
- 返却は「結論 → 根拠（path:line）→ 未確認点」の順で、生ログや全文を貼らない。
- 判断や設計が必要になったら推測で埋めず、未解決点として返す。
"""
