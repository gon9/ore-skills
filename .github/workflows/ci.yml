name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
      - name: ruff
        run: uv run ruff check .
      - name: pytest
        run: uv run pytest -q
      - name: skill health (SKILL.md 検証 / カタログ鮮度 / スキル別テスト)
        run: uv run bash scripts/check-skill-health.sh
