name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: ruff
        run: uv run --no-project --with ruff ruff check hooks/ tests/
      - name: pytest
        run: uv run --no-project --with pytest pytest tests/ -q
